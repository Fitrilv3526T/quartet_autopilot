<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quartet – paper trading desk</title>
<meta name="description" content="Four tested strategies running as an automatic paper-trading experiment.">
<meta name="theme-color" content="#E7ECF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E161F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='14' width='5' height='15' rx='2.5' fill='%232756E0'/%3E%3Crect x='10' y='6' width='5' height='23' rx='2.5' fill='%238A3FA8'/%3E%3Crect x='17' y='11' width='5' height='18' rx='2.5' fill='%230A8574'/%3E%3Crect x='24' y='3' width='5' height='26' rx='2.5' fill='%23B8700A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#E7ECF1; --grid:rgba(14,26,38,.05); --surface:#F6F8FA; --raised:#FFFFFF;
  --ink:#0E1A26; --ink2:#41546A; --ink3:#66788B; --rule:#C6D0DA; --rule2:#DAE1E8; --wash:#EDF1F5;
  --rsi2:#2756E0; --ibs:#8A3FA8; --carry:#0A8574; --st:#B8700A;
  --rsi2s:rgba(39,86,224,.2); --ibss:rgba(138,63,168,.2); --carrys:rgba(10,133,116,.2); --sts:rgba(184,112,10,.22);
  --up:#0B7A55; --down:#B5412B; --warn:#9A6200; --warnbg:#FBEFD2; --focus:#2756E0;
  --head:'Familjen Grotesk', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --body:'Source Sans 3', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --shadow:0 10px 30px -12px rgba(14,26,38,.35);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E161F; --grid:rgba(200,220,240,.05); --surface:#141E29; --raised:#192533;
    --ink:#E6EDF4; --ink2:#AEBCCB; --ink3:#8496A9; --rule:#2B3949; --rule2:#223040; --wash:#111A24;
    --rsi2:#7F9DFF; --ibs:#CC93E6; --carry:#3FD0B8; --st:#F2AC4E;
    --rsi2s:rgba(127,157,255,.25); --ibss:rgba(204,147,230,.25); --carrys:rgba(63,208,184,.22); --sts:rgba(242,172,78,.24);
    --up:#46D39D; --down:#FF8D72; --warn:#F2C36B; --warnbg:#3A2E12; --focus:#7F9DFF;
    --shadow:0 10px 30px -12px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.55 var(--body);color:var(--ink);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
  font-variant-numeric:tabular-nums; min-height:100vh}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--head);margin:0;font-weight:600;letter-spacing:-.015em}
button{font:inherit;color:inherit}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule2)}
.top-in{display:flex;align-items:center;gap:20px;min-height:60px;padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font:700 1.2rem var(--head);letter-spacing:-.02em}
.brand span{color:var(--ink3);font-size:.9rem}
.nav{display:flex;gap:2px;margin-left:12px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{position:relative;padding:18px 11px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:.95rem;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink)}
.nav a[aria-current=page]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--ink)}
.fresh{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink2);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--up)} .dot.old{background:#D99A1E} .dot.bad{background:var(--down)}
.btn{border:1px solid var(--rule);background:var(--raised);padding:7px 12px;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer}
.btn:hover{border-color:var(--ink3)}
.btn.ghost{background:transparent}
@media (max-width:760px){
  .top-in{flex-wrap:wrap;gap:0 12px;padding-bottom:0}
  .brand span{display:none}
  .fresh{margin-left:auto;font-size:.8rem}
  .fresh .ago-long{display:none}
  .nav{order:3;flex-basis:100%;margin:0 -6px}
  .nav a{padding:13px 10px;font-size:.92rem}
  .nav a[aria-current=page]::after{left:10px;right:10px}
}
.banner{background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--rule);font-size:.9rem}
.banner .wrap{padding-top:9px;padding-bottom:9px}
.banner b{font-weight:700}

main{padding:clamp(28px,5vw,56px) 0 72px}
section{margin-top:clamp(44px,7vw,76px)}
section:first-child{margin-top:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:18px}
.sec-head h2{font-size:1.3rem}
.sec-head p{margin:0;color:var(--ink2);max-width:62ch;font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.pos{color:var(--up)} .neg{color:var(--down)}
.num{font-variant-numeric:tabular-nums}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:end}
.hero h1{font-size:clamp(2rem,4.6vw,3.3rem);line-height:1.06;letter-spacing:-.03em;font-weight:600;max-width:21ch}
.hero h1 .lead{color:var(--ink3)}
.hero h1 .calm{color:var(--ink3)}
.hero h1 .warn{color:var(--warn)}
.hero .sub{margin:18px 0 0;color:var(--ink2);max-width:52ch}
.total{padding:6px 0 0}
.total .k{font-size:.85rem;color:var(--ink3);font-weight:600}
.total .v{font:600 clamp(2rem,3.6vw,2.7rem)/1.05 var(--head);letter-spacing:-.025em;margin-top:2px}
.total .d{font-weight:600;margin-top:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 20px;margin:18px 0 0;padding:16px 0 0;border-top:1px solid var(--rule);font-size:.92rem}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-weight:600;text-align:right}
@media (max-width:860px){.hero{grid-template-columns:1fr;align-items:start}}

/* recent activity */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:baseline;padding:11px 18px;border-top:1px solid var(--rule2);font-size:.95rem}
.feed li:first-child{border-top:0}
.feed .when{color:var(--ink3);font-size:.85rem}
.feed .what b{font-weight:600}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.empty{padding:26px 22px;color:var(--ink2)}
.empty b{color:var(--ink)}

/* ledger */
.ledger{overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(170px,1.15fr) minmax(0,1.9fr) 150px 96px 120px;gap:8px 22px;align-items:center;padding:18px 22px 18px 26px;border-top:1px solid var(--rule2);position:relative;text-decoration:none;color:inherit}
.lrow:first-child{border-top:0}
.lrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.lrow:hover{background:var(--wash)}
.lname b{display:block;font:600 1.08rem var(--head);letter-spacing:-.01em}
.lname span{color:var(--ink3);font-size:.88rem}
.lstate .chip{margin-bottom:5px}
.lstate p{margin:0;color:var(--ink2);font-size:.9rem;line-height:1.35}
.lcell .k{display:none;font-size:.75rem;color:var(--ink3)}
.lcell .big{font:600 1.15rem var(--head)}
.lhead{display:grid;grid-template-columns:minmax(170px,1.15fr) minmax(0,1.9fr) 150px 96px 120px;gap:8px 22px;padding:11px 22px 11px 26px;color:var(--ink3);font-size:.8rem;font-weight:600;border-bottom:1px solid var(--rule)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--wash);border:1px solid var(--rule2);color:var(--ink2)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.chip.on{color:var(--ink);border-color:var(--c);background:var(--cs,var(--wash))}
.chip.on i{background:var(--c)}
.chip.warn{color:var(--warn);background:var(--warnbg);border-color:transparent}
.chip.warn i{background:var(--warn)}
@media (max-width:860px){
  .lhead{display:none}
  .lrow{grid-template-columns:1fr 1fr;padding:16px 18px 16px 22px}
  .lname,.lstate{grid-column:1/-1}
  .lcell .k{display:block}
}

/* charts */
.chart-wrap{padding:16px 18px 10px}
.legend{display:flex;flex-wrap:wrap;gap:8px 10px;margin-bottom:10px}
.legend button{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--raised);font-size:.85rem;font-weight:600;cursor:pointer}
.legend button i{width:14px;height:4px;border-radius:2px;background:var(--c)}
.legend button[aria-pressed=false]{opacity:.45}
.legend button[aria-pressed=false] i{background:var(--ink3)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink3);font:500 11px var(--body)}
.chart .gl{stroke:var(--rule2);stroke-width:1}
.chart .zero{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 4}
.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--rule);border-radius:10px;padding:8px 11px;font-size:.82rem;box-shadow:var(--shadow);min-width:150px;transform:translate(-50%,0);opacity:0;transition:opacity .12s}
.chart .tip.show{opacity:1}
.chart .tip b{display:block;margin-bottom:3px;font-weight:600}
.chart .tip div{display:flex;justify-content:space-between;gap:14px}
.chart .tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
@media (prefers-reduced-motion:no-preference){
  .chart .ln.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}

/* trigger board */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.bcol{padding:20px 22px 22px;border-top:1px solid var(--rule2)}
.bcol:nth-child(-n+2){border-top:0}
.bcol:nth-child(odd){border-right:1px solid var(--rule2)}
.bcol h3{font-size:1.02rem;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.bcol .hint{margin:0 0 14px;color:var(--ink3);font-size:.85rem}
.rail-row{display:grid;grid-template-columns:48px 1fr 74px;gap:10px;align-items:center;margin:11px 0}
.rail-row .sym{font-weight:600;font-size:.9rem}
.rail-row .val{text-align:right;font-weight:600;font-size:.92rem}
.rail{position:relative;height:30px}
.rail .tr{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--rule2)}
.rail .zone{position:absolute;top:9px;height:12px;border-radius:3px;background:var(--cs,rgba(120,140,160,.28));border:1px solid var(--c)}
.rail .tick{position:absolute;top:5px;width:2px;height:20px;background:var(--ink3);border-radius:1px}
.rail .tl{position:absolute;top:-4px;font-size:.7rem;color:var(--ink3);transform:translateX(-50%);white-space:nowrap}
.rail .mk{position:absolute;top:6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--ink)}
.rail .mk.met{background:var(--c);box-shadow:0 0 0 1.5px var(--c)}
.rail-note{margin:2px 0 0 58px;font-size:.82rem;color:var(--ink3)}
.coins{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.coin{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:.8rem;font-weight:600;border:1px solid var(--rule);background:var(--raised)}
.coin.long{border-color:var(--up);color:var(--up)}
.coin.short{border-color:var(--down);color:var(--down)}
.coin.hold{box-shadow:inset 0 -3px 0 var(--c)}
.coin small{font-weight:500;color:var(--ink3)}
@media (max-width:860px){.board{grid-template-columns:1fr}.bcol{border-right:0!important;border-top:1px solid var(--rule2)!important}.bcol:first-child{border-top:0!important}}

/* clock */
.clock{padding:24px 26px 26px}
.cl-track{position:relative;height:10px;border-radius:5px;background:var(--rule2);margin:44px 0 52px}
.cl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink)}
.cl-pt{position:absolute;top:-6px;width:2px;height:22px;background:var(--ink3)}
.cl-pt span{position:absolute;white-space:nowrap;font-size:.8rem;color:var(--ink2);font-weight:600}
.cl-pt.up span{bottom:30px;left:50%;transform:translateX(-50%)}
.cl-pt.dn span{top:30px;left:50%;transform:translateX(-50%)}
.cl-now{position:absolute;top:-8px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--bg);border:3px solid var(--ink)}
.cl-txt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font-size:.92rem;color:var(--ink2)}
.cl-txt b{display:block;color:var(--ink);font-family:var(--head);font-size:1rem;margin-bottom:3px}
@media (max-width:760px){.cl-txt{grid-template-columns:1fr}.cl-pt span{font-size:.7rem}}

/* strategy detail */
.picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.picker a{display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);text-decoration:none;font-weight:600}
.picker a i{width:11px;height:11px;border-radius:3px;background:var(--c)}
.picker a[aria-current=page]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.picker a[aria-current=page] i{background:var(--c);outline:2px solid var(--bg)}
.sd-head{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start;margin-bottom:34px}
.sd-head h1{font-size:clamp(1.8rem,3.6vw,2.6rem);letter-spacing:-.025em;line-height:1.08}
.sd-head .idea{font-size:1.1rem;color:var(--ink2);margin:12px 0 0;max-width:46ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--ink2);background:var(--surface)}
.rules{margin:0;padding:18px 22px 18px 40px;font-size:.95rem;color:var(--ink2)}
.rules li{margin:6px 0}
.rules li::marker{color:var(--c);font-weight:700}
.ev{padding:6px 22px 14px}
.ev-row{display:grid;grid-template-columns:200px minmax(0,1fr) 190px;gap:10px 24px;align-items:center;padding:16px 0;border-top:1px solid var(--rule2)}
.ev-row:first-child{border-top:0}
.ev-row .nm b{display:block;font-weight:600}
.ev-row .nm span{font-size:.82rem;color:var(--ink3)}
.ev-row .res{font-size:.88rem;color:var(--ink2);line-height:1.35}
.ev-row .res b{display:block;font:600 1.05rem var(--head);color:var(--ink)}
.band{position:relative;height:34px}
.band .tr{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:3px;background:var(--rule2)}
.band .hat{position:absolute;top:12px;height:10px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--rule) 0 3px,transparent 3px 7px);opacity:.9}
.band .rng{position:absolute;top:11px;height:12px;border-radius:4px;background:var(--cs,rgba(120,140,160,.28));border:1px solid var(--c)}
.band .ex{position:absolute;top:8px;width:14px;height:14px;margin-left:-7px;transform:rotate(45deg);background:var(--surface);border:2.5px solid var(--c);top:10px}
.band .lv{position:absolute;top:7px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--ink)}
.band .ax{position:absolute;top:26px;font-size:.68rem;color:var(--ink3);transform:translateX(-50%)}
.legend-ev{display:flex;flex-wrap:wrap;gap:6px 22px;padding:0 22px 18px;font-size:.82rem;color:var(--ink2)}
.legend-ev span{display:inline-flex;align-items:center;gap:8px}
.legend-ev i{display:inline-block;width:11px;height:11px}
.legend-ev .d1{transform:rotate(45deg);border:2.5px solid var(--ink2)}
.legend-ev .d2{border-radius:50%;background:var(--ink)}
.legend-ev .d3{border-radius:3px;background:var(--rule2);border:1px solid var(--ink3);width:20px;height:10px}
.badge{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--wash);border:1px solid var(--rule);color:var(--ink2)}
.badge.good{color:var(--up);border-color:var(--up)}
.badge.bad{color:var(--down);border-color:var(--down)}
.badge.live{color:var(--up);border-color:var(--up)}
.badge.rej{color:var(--down);border-color:var(--down)}
@media (max-width:860px){.sd-head{grid-template-columns:1fr}.ev-row{grid-template-columns:1fr}.band{margin:4px 0 8px}}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{position:sticky;top:0;text-align:left;font-size:.78rem;font-weight:600;color:var(--ink3);padding:11px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--surface)}
th button{all:unset;cursor:pointer;display:inline-flex;gap:5px}
th button:hover{color:var(--ink)}
td{padding:11px 14px;border-top:1px solid var(--rule2);white-space:nowrap}
tr:first-child td{border-top:0}
td.r,th.r{text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:14px}
.filters .chipbtn{padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);font-weight:600;font-size:.86rem;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.filters .chipbtn i{width:9px;height:9px;border-radius:2px;background:var(--c,var(--ink3))}
.filters .chipbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters .sp{flex:1}
.tabs2{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.tabs2 button{border:0;background:var(--surface);padding:7px 14px;font-weight:600;font-size:.86rem;cursor:pointer}
.tabs2 button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sd-tables h3{font-size:1.05rem;margin:0 0 10px}
.mt{margin-top:26px}

/* evidence page */
.lede{font:500 clamp(1.2rem,2.4vw,1.55rem)/1.35 var(--head);letter-spacing:-.015em;max-width:44ch;margin:0}
.src{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;padding:14px 20px;border-top:1px solid var(--rule2);align-items:baseline;font-size:.92rem}
.src:first-child{border-top:0}
.src .d{color:var(--ink3);font-size:.84rem;word-break:break-word}
.points{margin:0;padding:6px 22px 18px 42px;color:var(--ink2)}
.points li{margin:9px 0}

/* misc */
.skel{height:220px;border-radius:14px;background:linear-gradient(90deg,var(--surface),var(--wash),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.cta{display:grid;gap:12px;padding:30px 28px;max-width:620px}
.cta h2{font-size:1.5rem}
.cta ol{margin:0;padding-left:22px;color:var(--ink2)}

<body>
<a class="sr" href="#main">Skip to content</a>
<div id="banner"></div>
<header class="top"><div class="wrap top-in">
  <a class="brand" href="#/overview" aria-label="Quartet home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="14" width="5" height="15" rx="2.5" fill="var(--rsi2)"/><rect x="10" y="6" width="5" height="23" rx="2.5" fill="var(--ibs)"/><rect x="17" y="11" width="5" height="18" rx="2.5" fill="var(--carry)"/><rect x="24" y="3" width="5" height="26" rx="2.5" fill="var(--st)"/></svg>
    <b>Quartet</b><span>paper trading desk</span>
  </a>
  <nav class="nav" id="nav" aria-label="Sections">
    <a href="#/overview" data-v="overview">Overview</a>
    <a href="#/strategies" data-v="strategies">Strategies</a>
    <a href="#/journal" data-v="journal">Journal</a>
    <a href="#/evidence" data-v="evidence">Evidence</a>
  </nav>
  <div class="fresh" id="fresh" role="status" aria-live="polite"><span class="dot" id="fdot"></span><span id="ftxt">Loading…</span><button class="btn ghost" id="reload" type="button">Refresh</button></div>
</div></header>
<main id="main"><div class="wrap" id="app"><div class="skel"></div></div></main>
<footer><div class="wrap">
  <p>Paper money only. This page reports a simulated experiment and is not financial advice. Backtests describe the past; live results can differ.</p>
  <p id="foot-meta"></p>
</div></footer>

<script>
(()=>{
'use strict';
const DAY=864e5, HOUR=36e5;
const COLORS={rsi2:'var(--rsi2)',ibs:'var(--ibs)',carry:'var(--carry)',st:'var(--st)'};
const ORDER=['rsi2','ibs','carry','st'];
let S=null, view={name:'overview',id:null}, hidden=new Set(), jf={strats:new Set(),status:'all',q:'',sort:['when',-1],tab:'trades'};
const $=(s,e=document)=>e.querySelector(s);
const esc=(x)=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MINUS='\u2212';
const zfmt=(f)=>(v)=>Math.abs(v)<1e-12?'0%':f(v);
const usd=(x,d=0)=>x==null||!isFinite(x)?'\u2014':(x<0?MINUS:'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgnUsd=(x,d=0)=>x==null||!isFinite(x)?'\u2014':(x>=0?'+':MINUS)+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(x,d=1)=>{if(x==null||!isFinite(x))return '\u2014';const t=Math.abs(x*100).toFixed(d);return (x<0&&+t!==0?MINUS:'')+t+'%'};
const sgnPct=(x,d=1)=>{if(x==null||!isFinite(x))return '\u2014';const t=Math.abs(x*100).toFixed(d);return (x<0&&+t!==0?MINUS:'+')+t+'%'};
const sgnR=(x)=>x==null||!isFinite(x)?'\u2014':(x>=0?'+':MINUS)+Math.abs(x).toFixed(2)+'R';
const cls=(x)=>x==null?'':x>0?'pos':x<0?'neg':'';
const px=(x)=>x==null?'\u2014':x>=1000?x.toLocaleString('en-US',{maximumFractionDigits:2}):x>=1?x.toFixed(2):x.toPrecision(3);
const dshort=(ms)=>new Date(ms).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const dlong=(ms)=>new Date(ms).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
const dtime=(ms)=>new Date(ms).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const sym=(s)=>String(s||'').replace('USDT','');
function ago(ms,now=Date.now()){const m=Math.max(0,Math.round((now-ms)/6e4));if(m<2)return 'just now';if(m<90)return m+' min ago';const h=Math.round(m/60);if(h<36)return h+' h ago';return Math.round(h/24)+' days ago'}
function inDays(ms,now=Date.now()){const d=Math.round((ms-now)/DAY);return d<=0?'today':d===1?'tomorrow':'in '+d+' days'}
const sl=(id)=>S.sleeves.find(s=>s.id===id);
const color=(id)=>COLORS[id]||'var(--ink)';
const cvar=(c)=>`--c:${c};--cs:${String(c).replace(/\)$/,'s)')}`;
const plural=(n,a,b)=>n+' '+(n===1?a:(b||a+'s'));

/* ---------- loading ---------- */
async function load(url){
  const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json();
}
async function boot(){
  const demo=/[?&]demo\b/.test(location.search);
  try{ S=await load(demo?'data/demo.json':'data/state.json'); if(demo)S.demo=true; }
  catch(e){ S=null; }
  render(); schedule();
}
let timer=null;
function schedule(){clearInterval(timer);timer=setInterval(async()=>{if(document.hidden||(S&&S.demo))return;try{S=await load('data/state.json');render(true)}catch(e){}},5*60*1000);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&!S.demo)$('#reload').click()});

/* ---------- routing ---------- */
function route(){
  const p=location.hash.replace(/^#\/?/,'').split('/');
  const name=['overview','strategies','journal','evidence'].includes(p[0])?p[0]:'overview';
  view={name,id:name==='strategies'?(ORDER.includes(p[1])?p[1]:'rsi2'):null};
}
window.addEventListener('hashchange',()=>{route();render();window.scrollTo({top:0})});

/* ---------- derived numbers ---------- */
function derive(){
  const now=S.updatedMs, days=Math.max(1,Math.floor((now-S.startMs)/DAY)+1), months=Math.max(0.0001,(now-S.startMs)/(30.44*DAY));
  return {now,days,months};
}
function nearest(s){ // the setup closest to firing, in words
  const w=s.watch; if(!w) return '';
  if(s.id==='rsi2'||s.id==='ibs'){
    const open=w.items.find(i=>i.holding); if(open) return `Holding ${open.sym}. Waiting for the exit rule.`;
    const arr=w.items.filter(i=>i.value!=null).sort((a,b)=>a.value-b.value); if(!arr.length) return '';
    const i=arr[0]; const lab=s.id==='rsi2'?'RSI(2)':'IBS';
    return `Closest: ${i.sym} at ${lab} ${i.value} (fires below ${i.trigger}).`+(s.id==='rsi2'&&!i.aboveSma?' Also needs to be above its 200-day average.':'');
  }
  if(s.id==='carry'){
    return w.items.map(i=>`${sym(i.sym)} ${i.annNow==null?'n/a':(i.annNow*100).toFixed(1)+'% a year'}`).join(', ')+' in funding. Hedge opens above '+(w.items[0].entry*100).toFixed(0)+'%.';
  }
  if(s.id==='st'){
    const r=w.regime; return `BTC is ${r.up?'above':'below'} its 200-day average, so only ${r.up?'longs':'shorts'} are allowed.`;
  }
  return '';
}
function stateChip(s){
  if(s.stale) return `<span class="chip warn"><i></i>Data issue</span>`;
  const n=s.stats?s.stats.open:0;
  if(s.id==='carry') return n? `<span class="chip on" style="${cvar(color(s.id))}"><i></i>Earning funding</span>`:`<span class="chip"><i></i>Hedge off</span>`;
  return n? `<span class="chip on" style="${cvar(color(s.id))}"><i></i>${plural(n,'trade')} open</span>`:`<span class="chip"><i></i>Waiting for a setup</span>`;
}

/* ---------- small graphics ---------- */
function spark(pts,c,w=140,h=40){
  if(!pts||pts.length<2) return `<svg width="${w}" height="${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="var(--rule)" stroke-dasharray="3 4"/></svg>`;
  const ys=pts.map(p=>p[1]), lo=Math.min(...ys,0), hi=Math.max(...ys,0), pad=(hi-lo||1)*.12;
  const X=i=>i/(pts.length-1)*(w-2)+1, Y=v=>h-2-((v-(lo-pad))/((hi+pad)-(lo-pad)))*(h-4);
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--rule)" stroke-dasharray="3 4"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function niceTicks(lo,hi,n=4){const span=hi-lo||1,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const t=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)t.push(+v.toFixed(10));return t}
function lineChart(el,series,{height=280,yfmt=(v,d=1)=>Math.abs(v)<1e-12?'0%':sgnPct(v,d)}={}){
  const draw=()=>{
    const W=Math.max(300,el.clientWidth||640),H=height,m={l:52,r:14,t:12,b:26};
    const all=series.filter(s=>!hidden.has(s.id)&&s.pts.length);
    if(!all.length){el.querySelector('.cv').innerHTML=`<div class="empty">Nothing to show. Turn a line back on above.</div>`;return}
    if(all.every(s=>s.pts.length<2)){el.querySelector('.cv').innerHTML=`<div class="empty"><b>The curve starts after the second day.</b> One day of data is not a line yet. Check back tomorrow.</div>`;return}
    let x0=Infinity,x1=-Infinity,y0=0,y1=0;
    all.forEach(s=>s.pts.forEach(([t,v])=>{x0=Math.min(x0,t);x1=Math.max(x1,t);y0=Math.min(y0,v);y1=Math.max(y1,v)}));
    if(x1===x0)x1=x0+DAY; const padY=(y1-y0||0.01)*.14; y0-=padY; y1+=padY; const dec=(y1-y0)<0.02?2:1;
    const X=t=>m.l+(t-x0)/(x1-x0)*(W-m.l-m.r),Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
    let g='';
    niceTicks(y0,y1,4).forEach(v=>{g+=`<line class="${Math.abs(v)<1e-12?'zero':'gl'}" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${yfmt(v,dec)}</text>`});
    const nt=W<520?3:5; for(let i=0;i<nt;i++){const t=x0+(x1-x0)*i/(nt-1);g+=`<text x="${X(t)}" y="${H-6}" text-anchor="${i===0?'start':i===nt-1?'end':'middle'}">${dshort(t)}</text>`}
    let p='';
    all.forEach(s=>{const d=s.pts.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join('');p+=`<path class="ln ${el.dataset.drawn?'':'draw'}" pathLength="1" d="${d}" stroke="${s.color}" ${s.id==='total'?'stroke-width="3"':''}/>`});
    el.querySelector('.cv').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(el.dataset.label||'Equity chart')}">${g}${p}<line id="vx" class="gl" y1="${m.t}" y2="${H-m.b}" style="display:none;stroke:var(--ink3)"/></svg><div class="tip"></div>`;
    el.dataset.drawn='1';
    const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),vx=el.querySelector('#vx');
    const move=(ev)=>{const r=svg.getBoundingClientRect(),px_=(ev.clientX-r.left)/r.width*W,t=x0+(px_-m.l)/(W-m.l-m.r)*(x1-x0);
      const day=Math.round(t/DAY)*DAY; const rows=all.map(s=>{let best=null;for(const q of s.pts){if(best==null||Math.abs(q[0]-day)<Math.abs(best[0]-day))best=q}return best&&Math.abs(best[0]-day)<=DAY?[s,best]:null}).filter(Boolean);
      if(!rows.length)return; const xx=X(rows[0][1][0]); vx.style.display='';vx.setAttribute('x1',xx);vx.setAttribute('x2',xx);
      tip.innerHTML=`<b>${dlong(rows[0][1][0])}</b>`+rows.map(([s,q])=>`<div><span><i style="--c:${s.color}"></i>${esc(s.name)}</span><span>${yfmt(q[1],2)}</span></div>`).join('');
      tip.style.left=Math.min(Math.max(xx/W*r.width,80),r.width-80)+'px';tip.style.top='6px';tip.classList.add('show')};
    svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
    svg.addEventListener('pointerleave',()=>{tip.classList.remove('show');vx.style.display='none'});
  };
  el.innerHTML='<div class="cv"></div>'; draw();
  if(window.ResizeObserver){let w=el.clientWidth;const ro=new ResizeObserver(()=>{if(Math.abs(el.clientWidth-w)>8){w=el.clientWidth;draw()}});ro.observe(el)}
}
function rail({min,max,zone,ticks=[],mark,color:c,fmtv,met}){
  const P=v=>Math.min(100,Math.max(0,(v-min)/(max-min)*100));
  return `<div class="rail" style="${cvar(c)}"><div class="tr"></div>`+(zone?`<div class="zone" style="left:${P(zone[0])}%;width:${Math.max(1.2,P(zone[1])-P(zone[0]))}%"></div>`:'')+
   ticks.map(t=>`<div class="tick" style="left:${P(t.v)}%"></div><div class="tl" style="left:${P(t.v)}%">${esc(t.l)}</div>`).join('')+
   (mark==null?'':`<div class="mk ${met?'met':''}" style="left:${P(mark)}%" title="${esc(fmtv?fmtv(mark):mark)}"></div>`)+`</div>`;
}

/* ---------- evidence bands: paper result against the backtest, with the doubt shown honestly ---------- */
function bandsFor(s,d){
  const bt=s.meta.backtest, st=s.stats||{}, n=st.closed||0, rows=[]; const z=1.645;
  const mk=(o)=>rows.push(o);
  if(s.id==='carry'){
    const base=S.cfg.carryNotional*S.cfg.startEquity*2, months=d.months;
    const live=(st.pnl||0)/base/months, hw=z*0.005/Math.sqrt(Math.max(months,0.25));
    mk({name:'Result per month',sub:'on the hedged amount',exp:bt.perMonthRet,hw,live,min:-0.01,max:0.02,f:(v)=>sgnPct(v,2),n:months,need:3,unit:'months',liveTxt:sgnPct(live,2)+' a month'});
    let held=0;[...s.open,...s.closed].forEach(p=>{held+=((p.exitMs||d.now)-p.entryMs)/DAY});
    const share=Math.min(1,held/(2*d.days)), hw2=z*0.2/Math.sqrt(Math.max(months,0.25));
    mk({name:'Time hedged',sub:'share of days with the hedge on',exp:bt.inPosition,hw:hw2,live:share,min:0,max:1,f:(v)=>pct(v,0),n:months,need:3,unit:'months',liveTxt:pct(share,0)+' of days'});
  }else{
    const sdw=Math.sqrt(bt.win*(1-bt.win)), hwW=n?z*sdw/Math.sqrt(n):null;
    mk({name:'Win rate',sub:`${n} closed trades`,exp:bt.win,hw:hwW,live:n?st.winRate:null,min:0,max:1,f:(v)=>pct(v,0),n,need:15,unit:'trades',liveTxt:n?pct(st.winRate,0):'no trades yet'});
    const lim=s.id==='st'?[-1.2,1.2]:[-0.8,0.8];
    mk({name:'Average result per trade',sub:'in units of risk (R)',exp:bt.avgR,hw:n?z*bt.rStd/Math.sqrt(n):null,live:n?st.avgR:null,min:lim[0],max:lim[1],f:(v)=>sgnR(v),n,need:15,unit:'trades',liveTxt:n?sgnR(st.avgR):'no trades yet'});
    const expN=bt.perMonth*d.months, hwP=z*Math.sqrt(Math.max(expN,1));
    mk({name:'Trade pace',sub:'closed trades so far',exp:expN,hw:hwP,live:n,min:0,max:Math.max(8,Math.ceil((expN+hwP)*1.25),n+2),f:(v)=>(+v).toFixed(v<10?1:0),n:d.months,need:2,unit:'months',liveTxt:plural(n,'trade')+' closed',noHat:true});
  }
  const dd=st.maxDD||0; mk({name:'Worst dip',sub:'peak to trough, paper account',exp:bt.maxDD,hw:null,live:dd,min:Math.min(-0.3,(bt.maxDD||0)*2),max:0,f:(v)=>pct(v,1),n:99,need:0,unit:'',liveTxt:pct(dd,1)+' so far',dd:true});
  return rows.map(r=>{
    let status,tone='';
    if(r.dd){status=r.live<r.exp*1.5?'Deeper than the worst backtest dip':'Within the backtest\u2019s worst dip';tone=r.live<r.exp*1.5?'bad':'good'}
    else if(r.n<r.need){status=`Too early: ${r.unit==='trades'?r.n+' of '+r.need+' trades':Math.max(0,r.n).toFixed(1)+' of '+r.need+' months'}`}
    else if(r.live>=r.exp-r.hw&&r.live<=r.exp+r.hw){status='Inside the expected range';tone='good'}
    else{status=r.live>r.exp?'Above the expected range':'Below the expected range';tone=r.live>r.exp?'good':'bad'}
    return Object.assign(r,{status,tone});
  });
}
function bandHtml(r,c){
  const P=v=>Math.min(100,Math.max(0,(v-r.min)/(r.max-r.min)*100));
  const lo=r.hw==null?null:Math.max(r.min,r.exp-r.hw),hi=r.hw==null?null:Math.min(r.max,r.exp+r.hw);
  const showHat=!r.dd&&r.hw!=null&&r.n<r.need&&!r.noHat;
  return `<div class="band" style="${cvar(c)}" role="img" aria-label="${esc(r.name)}: backtest ${esc(r.f(r.exp))}, paper ${esc(r.liveTxt)}"><div class="tr"></div>`+
    (r.hw!=null?`<div class="${showHat?'hat':'rng'}" style="left:${P(lo)}%;width:${Math.max(1,P(hi)-P(lo))}%"></div>`:'')+
    `<div class="ex" style="left:${P(r.exp)}%" title="Backtest ${esc(r.f(r.exp))}"></div>`+
    (r.live!=null?`<div class="lv" style="left:${P(r.live)}%" title="Paper ${esc(r.liveTxt)}"></div>`:'')+
    `<span class="ax" style="left:0%;transform:none">${esc(r.f(r.min))}</span><span class="ax" style="left:100%;transform:translateX(-100%)">${esc(r.f(r.max))}</span></div>`;
}
function evidenceBlock(s,d){
  const rows=bandsFor(s,d), c=color(s.id);
  return `<div class="panel ev" style="--c:${c}">`+rows.map(r=>`<div class="ev-row"><div class="nm"><b>${esc(r.name)}</b><span>${esc(r.sub)}</span></div>${bandHtml(r,c)}<div class="res"><b>${esc(r.liveTxt)}</b>${esc(r.status)}<br><span class="faint">Backtest: ${esc(r.f(r.exp))}</span></div></div>`).join('')+`</div>
  <div class="legend-ev"><span><i class="d1"></i>Backtest result</span><span><i class="d2"></i>This paper account</span><span><i class="d3"></i>Range the paper result should fall in, from luck alone. It narrows as trades accumulate; hatched while there is too little data.</span></div>`;
}

/* ---------- trigger board ---------- */
function boardCol(s,solo){
  const c=color(s.id), w=s.watch, m=s.meta; let body='';
  if(!w){ body='<p class="hint">No live readings yet.</p>'; }
  else if(s.id==='rsi2'){
    body=w.items.map(i=>`<div class="rail-row"><span class="sym">${i.sym}</span>${rail({min:0,max:100,zone:[0,i.trigger],ticks:[{v:i.trigger,l:String(i.trigger)}],mark:i.value,color:c,met:i.met})}<span class="val">${i.value==null?'\u2014':i.value}</span></div><div class="rail-note">${i.holding?'Holding now. ':''}${i.aboveSma?'Above':'Below'} its 200-day average by ${Math.abs(i.smaDistPct)}%${i.aboveSma?'':', so no entry is allowed'}.</div>`).join('');
  } else if(s.id==='ibs'){
    body=w.items.map(i=>`<div class="rail-row"><span class="sym">${i.sym}</span>${rail({min:0,max:1,zone:[0,i.trigger],ticks:[{v:i.trigger,l:String(i.trigger)}],mark:i.value,color:c,met:i.met})}<span class="val">${i.value==null?'\u2014':i.value}</span></div>${i.holding?'<div class="rail-note">Holding now.</div>':''}`).join('');
  } else if(s.id==='carry'){
    body=w.items.map(i=>{const v=i.annNow==null?null:i.annNow*100;return `<div class="rail-row"><span class="sym">${sym(i.sym)}</span>${rail({min:-5,max:25,zone:[i.entry*100,25],ticks:[{v:0,l:'0%'},{v:i.entry*100,l:(i.entry*100)+'%'}],mark:v,color:c,met:i.state})}<span class="val">${v==null?'\u2014':v.toFixed(1)+'%'}</span></div><div class="rail-note">${i.state?'Hedge on':'Hedge off'}. ${i.k}-day average funding per year; the hedge opens above ${i.entry*100}% and closes below ${i.exit*100}%. ${i.stale?'<b class="neg">Data is old.</b> ':''}</div>`}).join('');
  } else if(s.id==='st'){
    const r=w.regime;
    body=`<div class="rail-row" style="grid-template-columns:48px 1fr"><span class="sym">BTC</span><span>${esc(px(r.btcClose))} vs 200-day average ${esc(px(r.sma200))}: <b class="${r.up?'pos':'neg'}">${r.up?'longs allowed':'shorts allowed'}</b></span></div><div class="coins">`+
      w.coins.map(k=>{const dir=k.dir===1?'long':'short';return `<span class="coin ${dir} ${k.holding?'hold':''}" style="--c:${c}" title="Supertrend points ${dir==='long'?'up':'down'} for ${k.daysInDir} days. Stop distance about ${k.atrPct*3}% of price.">${k.dir===1?'+':MINUS}${sym(k.sym)} <small>${k.daysInDir}d</small></span>`}).join('')+`</div><p class="rail-note" style="margin-left:0;margin-top:10px">A plus means the trend points up, a minus down. Trades open only on a fresh flip that agrees with BTC\u2019s filter. Underlined coins are held.</p>`;
  }
  return `<div class="bcol">${solo?'':`<h3><span class="swatch" style="background:${c};margin:0"></span>${esc(m.name)}</h3><p class="hint">${esc(m.market)}</p>`}${body}</div>`;
}

/* ---------- views ---------- */
function renderHeaderState(){
  const age=S?Date.now()-S.updatedMs:null;
  $('#fdot').className='dot '+(S?(age<5*HOUR?'ok':age<14*HOUR?'old':'bad'):'');
  $('#ftxt').innerHTML=S?`<span class="ago-long">Data from </span>${esc(ago(S.updatedMs))}`:'No data yet';
  document.querySelectorAll('#nav a').forEach(a=>{a.toggleAttribute('aria-current',a.dataset.v===view.name);if(a.dataset.v===view.name)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#banner').innerHTML=S&&S.demo?`<div class="banner"><div class="wrap"><b>Sample data.</b> Everything here is simulated for preview. <a href="./">Back to your real data</a>.</div></div>`:'';
  $('#foot-meta').textContent=S?`Paper run started ${dlong(S.startMs)}. ${S.cfg.startEquity.toLocaleString('en-US')} paper dollars per strategy, ${(S.cfg.risk*100).toFixed(0)}% risked per trade.`:'';
}
function viewEmpty(){
  return `<section><div class="panel cta rise"><h2>No data yet</h2><p class="muted" style="margin:0">The page is working, but the scanner has not produced its first results. This usually takes a few minutes after setup.</p><ol><li>Open the <b>Actions</b> tab of this repository.</li><li>Choose <b>Quartet scan</b>, then <b>Run workflow</b>.</li><li>Wait about a minute, then press Refresh above.</li></ol><p style="margin:6px 0 0"><a class="btn" href="?demo" style="display:inline-block;text-decoration:none">Preview with sample data</a></p></div></section>`;
}
function eventsList(d){
  const ev=[]; S.sleeves.forEach(s=>{s.open.forEach(p=>ev.push({ms:p.entryMs,s,p,k:'in'}));s.closed.forEach(p=>{ev.push({ms:p.entryMs,s,p,k:'in'});ev.push({ms:p.exitMs,s,p,k:'out'})})});
  ev.sort((a,b)=>b.ms-a.ms); return ev.slice(0,8);
}
function viewOverview(){
  const d=derive(), cmb=S.combined, warn=S.health.warnings.length+S.sleeves.filter(s=>s.stale).length;
  const open=cmb.open, closed=cmb.closed;
  const h1=`<span class="lead">Day ${d.days} of the paper run.</span> ${open?`${plural(open,'position is','positions are')} open`:'Nothing is open'}${closed?` and ${plural(closed,'trade has','trades have')} closed`:' and no trade has closed yet'}. ${warn?`<span class="warn">${plural(warn,'data issue needs','data issues need')} a look.</span>`:'<span class="calm">Nothing needs your attention.</span>'}`;
  const ev=eventsList(d);
  const feed=ev.length?`<ul class="feed">`+ev.map(e=>{const p=e.p,c=color(e.s.id);const t=e.k==='in'?`Entered <b>${esc(sym(p.sym))}</b>${p.side===-1?' short':''}${p.entry?' at '+esc(px(p.entry)):''}${p.joined?' (hedge was already on at the start)':''}`:`Closed <b>${esc(sym(p.sym))}</b> (${esc(p.outcome)})`;
    const r=e.k==='out'?`<span class="${cls(p.pnl)}">${sgnUsd(p.pnl)}</span>`:'';return `<li><span class="when">${esc(ago(e.ms,d.now))}</span><span class="what"><span class="swatch" style="background:${c}"></span>${esc(e.s.meta.short)}: ${t}</span>${r}</li>`}).join('')+`</ul>`:
    `<div class="empty"><b>No trades yet.</b> That is normal: these strategies wait for rare setups. At the backtested pace RSI(2) trades about once a month, IBS about twice, Supertrend about four times, and the carry opens only when funding is high.</div>`;
  const ledger=ORDER.map(id=>{const s=sl(id);if(!s)return'';const st=s.stats||{},c=color(id);
    const pts=s.equity.map(e=>[e[0],e[1]/s.startEquity-1]);
    const pace=id==='carry'?'':`<span class="faint" style="font-size:.8rem">about ${s.meta.backtest.perMonth} a month expected</span>`;
    return `<a class="lrow rise" href="#/strategies/${id}" style="--c:${c}"><div class="lname"><b>${esc(s.meta.name)}</b><span>${esc(s.meta.market)}</span></div>
      <div class="lstate">${stateChip(s)}<p>${s.stale?esc(s.staleReason||'Showing the last good data.'):esc(nearest(s))}</p></div>
      <div class="lcell"><span class="k">Equity since start</span>${spark(pts,c)}</div>
      <div class="lcell"><span class="k">Since start</span><span class="big ${cls(st.ret)}">${sgnPct(st.ret,2)}</span></div>
      <div class="lcell"><span class="k">Trades closed</span><span class="big">${st.closed==null?'\u2014':st.closed}</span><br>${pace}</div></a>`}).join('');
  const lines=[{id:'total',name:'All four',color:'var(--ink)',pts:cmb.equity.map(e=>[e[0],e[1]/cmb.startEquity-1])}].concat(ORDER.map(id=>{const s=sl(id);return s?{id,name:s.meta.short,color:color(id),pts:s.equity.map(e=>[e[0],e[1]/s.startEquity-1])}:null}).filter(Boolean));
  const legend=lines.map(l=>`<button type="button" aria-pressed="${!hidden.has(l.id)}" data-line="${l.id}" style="--c:${l.color}"><i></i>${esc(l.name)}</button>`).join('');
  const clockDays=56, frac=Math.min(1,d.days/ (30.44*12)), w8=56/(30.44*12)*100, w6=6/12*100;
  const clockNow=Math.min(100,(d.now-S.startMs)/(30.44*12*DAY)*100);
  return `
  <section class="hero rise"><div><h1>${h1}</h1><p class="sub">Four strategies that survived a re-test, running as an automatic experiment with paper money. The scanner updates this page by itself.</p></div>
    <div class="total"><div class="k">Total paper equity</div><div class="v">${usd(cmb.equityNow)}</div><div class="d ${cls(cmb.ret)}">${sgnUsd(cmb.equityNow-cmb.startEquity)} (${sgnPct(cmb.ret,2)}) since start</div>
    <dl class="kv"><dt>Started with</dt><dd>${usd(cmb.startEquity)}</dd><dt>Worst dip so far</dt><dd class="${cmb.maxDD<-0.03?'neg':''}">${pct(cmb.maxDD,1)}</dd><dt>Open now</dt><dd>${open}</dd><dt>Closed trades</dt><dd>${closed}</dd></dl></div></section>
  <section><div class="sec-head"><h2>Strategies at a glance</h2><p>Select one for its rules, its live readings and how it compares with its backtest.</p></div>
    <div class="panel ledger"><div class="lhead"><span>Strategy</span><span>Right now</span><span>Equity since start</span><span>Since start</span><span>Trades closed</span></div>${ledger}</div></section>
  <section><div class="sec-head"><h2>Equity curves</h2><p>Each line shows percent change since the start, so strategies of any size compare fairly.</p></div>
    <div class="panel chart-wrap"><div class="legend" id="legend">${legend}</div><div class="chart" id="chart1" data-label="Percent change in paper equity since start"></div></div></section>
  <section><div class="sec-head"><h2>How close is each trigger?</h2><p>Live readings from the last finished candle. A filled marker means the entry rule is met.</p></div>
    <div class="panel board">${ORDER.map(id=>sl(id)?boardCol(sl(id)):'').join('')}</div></section>
  <section><div class="sec-head"><h2>What recently happened</h2></div><div class="panel">${feed}</div></section>
  <section><div class="sec-head"><h2>The experiment clock</h2><p>Paper results become convincing slowly, because these strategies trade rarely.</p></div>
    <div class="panel clock"><div class="cl-track" aria-hidden="true"><div class="cl-fill" style="width:${clockNow}%"></div><div class="cl-pt up" style="left:${w8}%"><span>Week 8</span></div><div class="cl-pt dn" style="left:${w6}%"><span>Month 6</span></div><div class="cl-pt up" style="left:100%"><span>Month 12</span></div><div class="cl-now" style="left:${clockNow}%"></div></div>
    <div class="cl-txt"><div><b>Week 8: does it work?</b>Do signals fire when the rules say they should, do the fills look realistic, and are the data feeds reliable? This is a check on the machinery, not on profits.</div><div><b>Month 6: a first look</b>Compare win rate and drawdown with the backtest bands. Most strategies will still have fewer than 15 closed trades, so treat any verdict as provisional.</div><div><b>Month 12: a real verdict</b>Enough trades to tell a working edge from luck, except for the slowest strategies. Keep paper trading until the evidence bands say something.</div></div></div></section>`;
}
function viewStrategy(){
  const id=view.id, s=sl(id), d=derive(); if(!s) return '<div class="empty">Strategy not found.</div>';
  const c=color(id), st=s.stats||{}, m=s.meta;
  const picker=`<nav class="picker" aria-label="Choose a strategy">`+ORDER.map(k=>`<a href="#/strategies/${k}" style="--c:${color(k)}" ${k===id?'aria-current="page"':''}><i></i>${esc(sl(k)?sl(k).meta.name:k)}</a>`).join('')+`</nav>`;
  const openRows=s.open.map(p=>`<tr><td>${dshort(p.entryMs)}</td><td>${esc(sym(p.sym))}</td><td>${p.side===1?(id==='carry'?'Hedge':'Long'):'Short'}</td><td class="r">${p.entry?esc(px(p.entry)):'\u2014'}</td><td class="r">${p.last?esc(px(p.last)):'\u2014'}</td><td class="r">${p.stop?esc(px(p.stop)):'\u2014'}</td><td class="r">${p.tp?esc(px(p.tp)):'\u2014'}</td><td class="r">${usd(p.N)}</td><td class="r ${cls(p.unreal)}">${sgnUsd(p.unreal,2)}</td></tr>`).join('');
  const closedRows=s.closed.slice(0,12).map(p=>`<tr><td>${dshort(p.entryMs)} to ${dshort(p.exitMs)}</td><td>${esc(sym(p.sym))}</td><td>${p.side===1?(id==='carry'?'Hedge':'Long'):'Short'}</td><td class="r">${p.entry?esc(px(p.entry)):'\u2014'}</td><td class="r">${p.exit?esc(px(p.exit)):'\u2014'}</td><td class="r">${usd(p.N)}</td><td class="r ${cls(p.pnl)}">${sgnUsd(p.pnl,2)}</td><td class="r ${cls(p.R!=null?p.R:p.pct)}">${p.R!=null?sgnR(p.R):sgnPct(p.pct,2)}</td><td>${esc(p.outcome)}</td></tr>`).join('');
  const stale=s.stale?`<div class="panel" style="padding:14px 18px;margin-bottom:22px;border-color:var(--warn);color:var(--warn)"><b>Data issue.</b> ${esc(s.staleReason||'Showing the last good data.')}</div>`:'';
  return `${picker}${stale}
  <div class="sd-head rise" style="--c:${c}"><div><h1>${esc(m.name)}</h1><p class="idea">${esc(m.idea)}</p><div class="tags"><span class="tag">${esc(m.market)}</span><span class="tag">${esc(m.direction)}</span><span class="tag">${esc(m.cadence)}</span></div></div>
    <div class="panel"><ol class="rules" style="--c:${c}">${m.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div></div>
  <section><div class="sec-head"><h2>Paper results against the backtest</h2><p>${esc(m.evidence.numbers)}. Backtest: ${esc(m.backtest.span)}, ${esc(m.evidence.checks)} stress checks passed.</p></div>${evidenceBlock(s,d)}</section>
  <section><div class="sec-head"><h2>Equity</h2><p>${usd(st.equityNow)} now, ${sgnPct(st.ret,2)} since start.</p></div><div class="panel chart-wrap"><div class="chart" id="chart1" data-label="Percent change in this strategy\u2019s paper equity"></div></div></section>
  <section><div class="sec-head"><h2>Live readings</h2></div><div class="panel board" style="grid-template-columns:1fr">${boardCol(s,true)}</div></section>
  <section class="sd-tables"><div class="sec-head"><h2>Open positions</h2></div>
    <div class="panel tbl-wrap">${s.open.length?`<table><thead><tr><th>Opened</th><th>Symbol</th><th>Side</th><th class="r">Entry</th><th class="r">Now</th><th class="r">Stop</th><th class="r">Target</th><th class="r">Size</th><th class="r">P&amp;L now</th></tr></thead><tbody>${openRows}</tbody></table>`:'<div class="empty">No open positions.</div>'}</div>
    <div class="sec-head mt"><h2>Closed trades</h2><p>${s.closed.length>12?'The latest 12. The full list is in the trade journal.':''}</p></div>
    <div class="panel tbl-wrap">${s.closed.length?`<table><thead><tr><th>Dates</th><th>Symbol</th><th>Side</th><th class="r">Entry</th><th class="r">Exit</th><th class="r">Size</th><th class="r">P&amp;L</th><th class="r">Result</th><th>How it ended</th></tr></thead><tbody>${closedRows}</tbody></table>`:'<div class="empty">No closed trades yet.</div>'}</div></section>`;
}
function journalRows(){
  const out=[]; S.sleeves.forEach(s=>{s.open.forEach(p=>out.push({s,p,open:true,ms:p.entryMs}));s.closed.forEach(p=>out.push({s,p,open:false,ms:p.exitMs}))});
  const q=jf.q.trim().toLowerCase();
  let r=out.filter(x=>(!jf.strats.size||jf.strats.has(x.s.id))&&(jf.status==='all'||(jf.status==='open')===x.open)&&(!q||x.p.sym.toLowerCase().includes(q)||x.s.meta.short.toLowerCase().includes(q)));
  const key=jf.sort[0],dir=jf.sort[1];
  const val={when:x=>x.ms,strat:x=>x.s.meta.short,sym:x=>x.p.sym,size:x=>x.p.N||0,pnl:x=>(x.open?x.p.unreal:x.p.pnl)||0,res:x=>x.p.R!=null?x.p.R:(x.p.pct||0)}[key]||(x=>x.ms);
  r.sort((a,b)=>{const A=val(a),B=val(b);return (A>B?1:A<B?-1:0)*dir});return r;
}
function viewJournal(){
  const chips=ORDER.map(id=>sl(id)?`<button class="chipbtn" type="button" style="--c:${color(id)}" aria-pressed="${jf.strats.has(id)}" data-js="${id}"><i></i>${esc(sl(id).meta.short)}</button>`:'').join('');
  const th=(k,l,r)=>`<th class="${r?'r':''}" aria-sort="${jf.sort[0]===k?(jf.sort[1]>0?'ascending':'descending'):'none'}"><button type="button" data-sort="${k}">${l}${jf.sort[0]===k?(jf.sort[1]>0?' \u2191':' \u2193'):''}</button></th>`;
  let body='';
  if(jf.tab==='trades'){
    const rows=journalRows();
    body=rows.length?`<div class="panel tbl-wrap"><table><thead><tr>${th('when','When')}${th('strat','Strategy')}${th('sym','Symbol')}<th>Side</th><th class="r">Entry</th><th class="r">Exit or now</th>${th('size','Size',1)}${th('pnl','P&amp;L',1)}${th('res','Result',1)}<th>Status</th></tr></thead><tbody>`+rows.map(({s,p,open})=>`<tr><td>${esc(dlong(open?p.entryMs:p.exitMs))}</td><td><span class="swatch" style="background:${color(s.id)}"></span>${esc(s.meta.short)}</td><td>${esc(sym(p.sym))}</td><td>${p.side===1?(s.id==='carry'?'Hedge':'Long'):'Short'}</td><td class="r">${p.entry?esc(px(p.entry)):'\u2014'}</td><td class="r">${esc(px(open?p.last:p.exit))}</td><td class="r">${usd(p.N)}</td><td class="r ${cls(open?p.unreal:p.pnl)}">${sgnUsd(open?p.unreal:p.pnl,2)}</td><td class="r ${cls(p.R!=null?p.R:p.pct)}">${open?'\u2014':(p.R!=null?sgnR(p.R):sgnPct(p.pct,2))}</td><td>${open?'<span class="chip on" style="'+cvar(color(s.id))+'"><i></i>Open</span>':esc(p.outcome)}</td></tr>`).join('')+`</tbody></table></div>`:
      `<div class="panel empty"><b>No trades match.</b> ${S.combined.closed+S.combined.open===0?'None have happened yet. Entries appear here as soon as a strategy fires.':'Try clearing a filter.'}</div>`;
  }else{
    const rows=[]; S.sleeves.forEach(s=>s.log.forEach(l=>rows.push({s,l}))); rows.sort((a,b)=>b.l.entryMs-a.l.entryMs);
    body=rows.length?`<div class="panel tbl-wrap"><table><thead><tr><th>Signal date</th><th>Strategy</th><th>Symbol</th><th>Side</th><th class="r">Planned entry</th><th>What the paper account did</th></tr></thead><tbody>`+rows.map(({s,l})=>`<tr><td>${esc(dlong(l.sigMs))}</td><td><span class="swatch" style="background:${color(s.id)}"></span>${esc(s.meta.short)}</td><td>${esc(sym(l.sym))}</td><td>${l.side===1?'Long':'Short'}</td><td class="r">${l.entry?esc(px(l.entry)):'\u2014'}</td><td>${esc(l.status)}</td></tr>`).join('')+`</tbody></table></div>`:`<div class="panel empty">No signals recorded yet.</div>`;
  }
  return `<section><div class="sec-head"><h1 style="font-size:1.8rem">Trade journal</h1><p>Every paper trade, newest first. The signal log also lists signals that were skipped, with the reason.</p></div>
   <div class="filters"><div class="tabs2" role="group" aria-label="Table"><button type="button" aria-pressed="${jf.tab==='trades'}" data-tab="trades">Trades</button><button type="button" aria-pressed="${jf.tab==='log'}" data-tab="log">Signal log</button></div>
   ${jf.tab==='trades'?chips+`<div class="tabs2" role="group" aria-label="Status"><button type="button" aria-pressed="${jf.status==='all'}" data-st="all">All</button><button type="button" aria-pressed="${jf.status==='open'}" data-st="open">Open</button><button type="button" aria-pressed="${jf.status==='closed'}" data-st="closed">Closed</button></div><label class="sr" for="q">Search symbol</label><input id="q" type="search" placeholder="Search symbol" value="${esc(jf.q)}" style="border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:.86rem;width:150px">`:''}
   <span class="sp"></span><button class="btn" type="button" id="csv">Download CSV</button></div>${body}</section>`;
}
function viewEvidence(){
  const R=S.research, H=S.health;
  const rows=R.tested.map(t=>`<tr><td><b>${esc(t.name)}</b><br><span class="faint" style="font-size:.84rem">${esc(t.market)}</span></td><td><span class="badge ${t.verdict==='live'?'live':'rej'}">${t.verdict==='live'?'Running here':'Rejected'}</span></td><td>${esc(t.numbers)}</td><td>${esc(t.checks)}</td><td style="white-space:normal;min-width:260px">${esc(t.note)}</td></tr>`).join('');
  const src=H.sources.map(x=>`<div class="src"><span class="dot ${x.ok?'ok':'bad'}" title="${x.ok?'Working':'Problem'}"></span><div><b>${esc(x.label)}</b><div class="d">${esc(x.detail||'')}</div></div><span class="faint" style="font-size:.84rem">${x.asOfMs?'to '+esc(dlong(x.asOfMs)):''}</span></div>`).join('');
  return `<section><h1 class="lede rise">${esc(R.headline)}</h1></section>
  <section><div class="sec-head"><h2>What we tested</h2><p>Six strategies from two research reports, each rebuilt from its rules on real data and then stressed: doubled costs, random entries, both halves of history, best year removed, and more.</p></div>
    <div class="panel tbl-wrap"><table><thead><tr><th>Strategy</th><th>Status</th><th>Report numbers</th><th>Stress checks</th><th>Verdict</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section><div class="sec-head"><h2>What paper trading can and cannot tell you</h2></div><div class="panel"><ul class="points">${R.cannot.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>
  <section><div class="sec-head"><h2>Data feeds</h2><p>${H.warnings.length?'Some feeds need attention.':'All feeds are working.'}</p></div>
    ${H.warnings.length?`<div class="panel" style="padding:6px 22px;margin-bottom:14px;border-color:var(--warn)"><ul class="points" style="color:var(--warn);padding-left:20px">${H.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:''}
    <div class="panel">${src}</div></section>
  <section><div class="sec-head"><h2>Settings</h2></div><div class="panel" style="padding:18px 22px;color:var(--ink2)">Edit <b>config.json</b> in the repository to change the paper dollars per strategy (<b>startEquity</b>), the risk per trade (<b>risk</b>), or turn a strategy off (<b>enabled</b>). The <b>startMs</b> value is the moment the paper run began; delete it to restart the experiment from the next scan.</div></section>`;
}

/* ---------- render + events ---------- */
function render(keep){
  route(); renderHeaderState();
  const app=$('#app'); const y=window.scrollY;
  if(!S){app.innerHTML=viewEmpty();return}
  app.innerHTML=view.name==='overview'?viewOverview():view.name==='strategies'?viewStrategy():view.name==='journal'?viewJournal():viewEvidence();
  const ch=$('#chart1');
  if(ch){
    if(view.name==='overview'){
      const draw=()=>{const lines=[{id:'total',name:'All four',color:'var(--ink)',pts:S.combined.equity.map(e=>[e[0],e[1]/S.combined.startEquity-1])}].concat(ORDER.map(id=>{const s=sl(id);return s?{id,name:s.meta.short,color:color(id),pts:s.equity.map(e=>[e[0],e[1]/s.startEquity-1])}:null}).filter(Boolean));lineChart(ch,lines.filter(l=>!hidden.has(l.id)),{})};
      draw(); $('#legend').addEventListener('click',(e)=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.line;hidden.has(k)?hidden.delete(k):hidden.add(k);b.setAttribute('aria-pressed',!hidden.has(k));ch.dataset.drawn='1';draw()});
    }else{
      const s=sl(view.id); lineChart(ch,[{id:s.id,name:s.meta.short,color:color(s.id),pts:s.equity.map(e=>[e[0],e[1]/s.startEquity-1])}],{});
    }
    if(keep)ch.dataset.drawn='1';
  }
  if(view.name==='journal') bindJournal();
  if(keep)window.scrollTo(0,y);
}
function bindJournal(){
  const app=$('#app');
  app.onclick=(e)=>{const t=e.target.closest('button');if(!t)return;
    if(t.dataset.js){jf.strats.has(t.dataset.js)?jf.strats.delete(t.dataset.js):jf.strats.add(t.dataset.js);render(true)}
    else if(t.dataset.st){jf.status=t.dataset.st;render(true)}
    else if(t.dataset.tab){jf.tab=t.dataset.tab;render(true)}
    else if(t.dataset.sort){const k=t.dataset.sort;jf.sort=jf.sort[0]===k?[k,-jf.sort[1]]:[k,-1];render(true)}
    else if(t.id==='csv')csv();};
  const q=$('#q'); if(q)q.oninput=()=>{jf.q=q.value;const pos=q.selectionStart;render(true);const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
}
function csv(){
  const rows=[['strategy','symbol','side','status','entered_utc','exited_utc','entry','exit_or_last','size_usd','pnl_usd','result','outcome']];
  journalRows().forEach(({s,p,open})=>rows.push([s.id,p.sym,p.side===1?'long':'short',open?'open':'closed',new Date(p.entryMs).toISOString(),p.exitMs?new Date(p.exitMs).toISOString():'',p.entry??'',(open?p.last:p.exit)??'',p.N??'',(open?p.unreal:p.pnl)??'',p.R??p.pct??'',p.outcome||'']));
  const blob=new Blob([rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quartet_trades.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('#reload').addEventListener('click',async()=>{const b=$('#reload');b.disabled=true;b.textContent='Refreshing';try{S=await load(S&&S.demo?'data/demo.json':'data/state.json');if(S&&/[?&]demo\b/.test(location.search))S.demo=true}catch(e){}b.disabled=false;b.textContent='Refresh';render(true)});
setInterval(()=>{if(S)renderHeaderState()},60000);
route(); boot();
})();
